name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Show log tail
        if: always()
        run: tail -30 build.log

      - name: Assert build success
        run: grep -q "BUILD SUCCESSFUL" build.log

      # Sign all APKs using keystore secrets
      - name: Sign APKs
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          # Find and sign all release APKs (handles split APKs)
          for apk in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk" .apk)
            signed="app/build/outputs/apk/release/${name}-signed.apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$STORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$signed" \
              "$apk"
            echo "Signed: $signed"
          done
          rm keystore.jks

      - name: List APKs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fb-client-apk
          path: app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FB Client ${{ github.ref_name }}
          body: |
            ## FB Client ${{ github.ref_name }}
            GeckoView-based Facebook client with extension support.

            ### Download the right APK for your device:
            - **arm64-v8a** → Most modern phones (Redmi, Samsung, Pixel)
            - **armeabi-v7a** → Older 32-bit phones
            - **x86_64** → Emulators only
          files: app/build/outputs/apk/release/*-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
